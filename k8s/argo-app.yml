apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-pipeline
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/danielmoisa/api-pipeline
    targetRevision: master
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
